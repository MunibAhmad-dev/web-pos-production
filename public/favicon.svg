<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Pink rounded background -->
  <rect width="48" height="48" rx="11" fill="#FF4E7D"/>
  <!-- Soft inner glow -->
  <rect width="48" height="48" rx="11" fill="url(#glow)" opacity="0.3"/>
  <!-- Store canopy / awning -->
  <path d="M6 20 L12 10 H36 L42 20 H6Z" fill="rgba(255,255,255,0.95)" rx="2"/>
  <!-- Store body -->
  <rect x="9" y="20" width="30" height="20" rx="2" fill="white"/>
  <!-- Door -->
  <rect x="19" y="28" width="10" height="12" rx="1.5" fill="#FF4E7D"/>
  <!-- Left window -->
  <rect x="11" y="24" width="7" height="5" rx="1" fill="#FF91AE"/>
  <!-- Right window -->
  <rect x="30" y="24" width="7" height="5" rx="1" fill="#FF91AE"/>
  <!-- Canopy stripe accent -->
  <path d="M6 20 L42 20" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <defs>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
